<!DOCTYPE html>
<html>
<body>
<script>
  const bridges = Object.keys(window).filter(k => /Handler|Tracking|Coupang/.test(k));
  let out = JSON.stringify(bridges) + '\n\n';
  bridges.forEach(name => {
    try {
      const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(window[name]) || {})
        .concat(Object.keys(window[name]));
      out += name + ': ' + JSON.stringify(methods) + '\n';
    } catch(e) {
      out += name + ': error - ' + e.message + '\n';
    }
  });
  document.getElementById('output').innerText = out;
</script>
</body>
</html>
